<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mente en Juego — Tu forma de decidir</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 12% 8%, rgba(14,165,233,.12), transparent 25%),
      radial-gradient(circle at 88% 18%, rgba(236,72,153,.10), transparent 22%),
      linear-gradient(135deg,#f8fbff,#fff7fb 55%,#f7fff9);
    color:#172033;
  }
  .glass{
    background:rgba(255,255,255,.88);
    border:1px solid rgba(148,163,184,.22);
    box-shadow:0 18px 55px rgba(30,41,59,.10);
    backdrop-filter:blur(14px);
  }
  .choice{transition:.2s ease}
  .choice:hover{transform:translateY(-2px);border-color:#38bdf8;box-shadow:0 10px 28px rgba(14,165,233,.12)}
  .fade{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .pulse{animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
</style>
</head>
<body class="font-sans">
<div class="max-w-5xl mx-auto px-4 py-6 md:py-10">

<header class="glass rounded-3xl p-5 md:p-7 mb-5">
  <div class="flex flex-col md:flex-row justify-between gap-4 md:items-center">
    <div>
      <div class="text-xs tracking-[.25em] uppercase text-sky-600 font-bold">Experiencia de autoconocimiento</div>
      <h1 class="text-3xl md:text-5xl font-black mt-1">🎮 MENTE EN JUEGO</h1>
      <p class="text-slate-500 mt-2">¿Cómo tomas decisiones cuando hay presión?</p>
    </div>
    <div class="grid grid-cols-2 gap-3 min-w-[230px]">
      <div class="rounded-2xl bg-sky-50 p-3 text-center">
        <div class="text-xs text-slate-500">Escenario</div>
        <div id="sceneCount" class="font-black text-sky-700 text-xl">1/8</div>
      </div>
      <div class="rounded-2xl bg-pink-50 p-3 text-center">
        <div class="text-xs text-slate-500">Progreso</div>
        <div id="progressText" class="font-black text-pink-600 text-xl">0%</div>
      </div>
    </div>
  </div>
  <div class="h-3 bg-slate-100 rounded-full mt-5 overflow-hidden">
    <div id="progressBar" class="h-full bg-gradient-to-r from-sky-400 to-pink-400 transition-all duration-500" style="width:0%"></div>
  </div>
</header>

<main id="app" class="glass rounded-3xl p-5 md:p-8 min-h-[560px]"></main>

<footer class="text-center text-xs text-slate-400 mt-5">
  Esta experiencia es educativa y orientativa. No sustituye una evaluación psicológica profesional ni emite diagnósticos.
</footer>
</div>

<script>
const scenarios = [
{
 title:"1. ¿Quién soy?",
 icon:"🪞",
 text:"Llegas a un lugar nuevo donde casi nadie te conoce. Notas que el grupo tiene una forma muy marcada de vestir, hablar y comportarse. Tú eres diferente en varias cosas.",
 q:"¿Qué harías con mayor naturalidad?",
 opts:[
  ["Observo primero cómo funciona el grupo antes de mostrar demasiado de mí.","reflexivo"],
  ["Me adapto rápido para conectar con los demás y sentirme parte.","social"],
  ["Mantengo mi estilo y digo lo que pienso aunque destaque.","autonomo"],
  ["Busco a alguien con quien pueda conversar y encontrar un punto medio.","armonizador"]
 ]
},
{
 title:"2. Todos lo hacen",
 icon:"👥",
 text:"Tus amigos quieren que participes en algo que no te convence. Insisten y te dicen: “No seas aburrido, todos vamos a hacerlo”.",
 q:"¿Qué reacción se parece más a ti?",
 opts:[
  ["Pido tiempo para pensar antes de decidir.","reflexivo"],
  ["Probablemente acepto para no quedarme fuera.","social"],
  ["Digo que no si realmente no quiero hacerlo.","autonomo"],
  ["Intento explicar mi posición sin generar conflicto.","armonizador"]
 ]
},
{
 title:"3. Mi vida vs. redes sociales",
 icon:"📱",
 text:"Ves publicaciones de personas de tu edad que parecen tener mejores experiencias, más amigos, más logros y una vida perfecta.",
 q:"¿Qué suele pasar por tu mente?",
 opts:[
  ["Me pregunto qué parte de esa realidad no estoy viendo.","reflexivo"],
  ["Me afecta bastante lo que otros están haciendo o consiguiendo.","social"],
  ["Lo observo, pero intento no compararme demasiado.","autonomo"],
  ["Me alegro por ellos, aunque a veces también me cuestione.","armonizador"]
 ]
},
{
 title:"4. Cuando algo te molesta",
 icon:"🔥",
 text:"Recibes un mensaje que interpretas como una falta de respeto. Sientes enojo inmediatamente.",
 q:"¿Qué haces con más frecuencia?",
 opts:[
  ["Espero un poco antes de responder y trato de entender qué pasó.","reflexivo"],
  ["Le cuento a alguien cercano antes de decidir qué hacer.","social"],
  ["Respondo directamente y dejo claro lo que pienso.","autonomo"],
  ["Busco aclararlo sin convertirlo en una pelea.","armonizador"]
 ]
},
{
 title:"5. Decidir bajo presión",
 icon:"⚡",
 text:"Debes tomar una decisión importante rápidamente. Hay opiniones diferentes alrededor y poco tiempo.",
 q:"¿En qué te apoyas primero?",
 opts:[
  ["En analizar consecuencias y posibilidades.","reflexivo"],
  ["En lo que opinan personas de confianza.","social"],
  ["En mi criterio y lo que considero correcto para mí.","autonomo"],
  ["En encontrar una solución que afecte lo menos posible a todos.","armonizador"]
 ]
},
{
 title:"6. Límites",
 icon:"🚧",
 text:"Una amistad te exige cada vez más tiempo y atención y empieza a interferir con tus propias responsabilidades.",
 q:"¿Cómo reaccionarías?",
 opts:[
  ["Pienso bien cómo plantearlo antes de conversar.","reflexivo"],
  ["Me cuesta poner límites porque no quiero perder la relación.","social"],
  ["Marco claramente hasta dónde puedo llegar.","autonomo"],
  ["Intento negociar una forma que funcione para ambos.","armonizador"]
 ]
},
{
 title:"7. Demasiado encima",
 icon:"⏳",
 text:"Tienes muchas cosas pendientes al mismo tiempo: estudio, familia, amigos y responsabilidades personales.",
 q:"¿Cuál suele ser tu primera reacción?",
 opts:[
  ["Organizo prioridades y voy resolviendo una por una.","reflexivo"],
  ["Busco compañía, consejo o apoyo para sentir que no estoy solo.","social"],
  ["Me enfoco en resolverlo por mi cuenta.","autonomo"],
  ["Intento equilibrar las necesidades de todos, además de las mías.","armonizador"]
 ]
},
{
 title:"8. El espejo final",
 icon:"🧠",
 text:"Una decisión podría beneficiarte personalmente, pero alguien cercano podría sentirse incómodo con ella.",
 q:"¿Qué pesa más en tu decisión?",
 opts:[
  ["Las consecuencias a mediano y largo plazo.","reflexivo"],
  ["Cómo reaccionarán las personas importantes para mí.","social"],
  ["Si la decisión coincide con mis valores y necesidades.","autonomo"],
  ["Encontrar un equilibrio entre mis necesidades y las de otros.","armonizador"]
 ]
}
];

const profiles = {
 reflexivo:{
  name:"Estratega Reflexivo",
  icon:"🧠",
  desc:"Tiendes a detenerte, observar y analizar antes de actuar. Buscas comprender consecuencias y reducir decisiones impulsivas.",
  strengths:["Análisis de consecuencias","Planificación","Autocontrol ante presión","Pensamiento antes de actuar"],
  watch:"Pensar demasiado puede retrasar decisiones que requieren acción. A veces conviene aceptar que no tendrás toda la información."
 },
 social:{
  name:"Conector Social",
  icon:"🤝",
  desc:"Las relaciones, la pertenencia y la opinión de personas significativas suelen tener peso importante en tus decisiones.",
  strengths:["Sensibilidad interpersonal","Capacidad de conexión","Búsqueda de apoyo","Lectura del entorno social"],
  watch:"Conviene revisar cuándo una decisión nace de lo que realmente quieres y cuándo surge principalmente del miedo a quedar fuera o decepcionar."
 },
 autonomo:{
  name:"Decisor Autónomo",
  icon:"🎯",
  desc:"Tiendes a apoyarte en tus propios criterios, valores y límites. Puedes defender una decisión incluso cuando otros piensan distinto.",
  strengths:["Independencia","Claridad de límites","Seguridad para decidir","Coherencia con valores personales"],
  watch:"La autonomía es valiosa, pero escuchar otras perspectivas puede ampliar información y evitar decisiones demasiado rígidas."
 },
 armonizador:{
  name:"Mediador",
  icon:"💬",
  desc:"Buscas equilibrio. Antes de decidir sueles considerar cómo una elección puede afectar tanto a ti como a otras personas.",
  strengths:["Empatía","Negociación","Comunicación","Manejo de conflictos"],
  watch:"Buscar armonía constantemente puede llevarte a postergar tus propias necesidades. El equilibrio también incluye saber decir no."
 }
};

let state = JSON.parse(localStorage.getItem("mentePerfilState")) || {current:0, answers:[], started:false};

function save(){ localStorage.setItem("mentePerfilState",JSON.stringify(state)); }

function updateHUD(){
 const done=state.answers.length;
 const pct=Math.round(done/scenarios.length*100);
 document.getElementById("progressBar").style.width=pct+"%";
 document.getElementById("progressText").textContent=pct+"%";
 document.getElementById("sceneCount").textContent=Math.min(state.current+1,8)+"/8";
}

function start(){
 state.started=true; save(); renderScene();
}

function resetGame(){
 state={current:0,answers:[],started:false};
 localStorage.removeItem("mentePerfilState");
 updateHUD(); renderIntro();
}

function renderIntro(){
 document.getElementById("app").innerHTML=`
 <section class="max-w-3xl mx-auto text-center py-8 fade">
   <div class="text-7xl pulse mb-5">🧠</div>
   <div class="text-xs uppercase tracking-[.28em] text-pink-500 font-bold">El espejo de tus decisiones</div>
   <h2 class="text-3xl md:text-5xl font-black mt-2">Aquí no hay respuestas correctas.</h2>
   <p class="text-slate-600 text-lg leading-relaxed mt-5">
     Cada situación mostrará una forma distinta de responder ante presión, relaciones, emociones y decisiones cotidianas.
     Elige la opción que <strong>más se parezca a lo que realmente harías</strong>, no la que parezca “mejor”.
   </p>
   <div class="grid md:grid-cols-4 gap-3 mt-7 text-sm">
     <div class="rounded-2xl bg-sky-50 p-4">🧠 Análisis</div>
     <div class="rounded-2xl bg-pink-50 p-4">🤝 Entorno social</div>
     <div class="rounded-2xl bg-amber-50 p-4">🎯 Autonomía</div>
     <div class="rounded-2xl bg-emerald-50 p-4">💬 Armonía</div>
   </div>
   <p class="text-sm text-slate-500 mt-5">No se otorgarán puntos ni calificaciones.</p>
   <button onclick="start()" class="mt-7 bg-slate-900 text-white px-7 py-4 rounded-2xl font-black hover:scale-105 transition">
     DESCUBRIR MI FORMA DE DECIDIR
   </button>
 </section>`;
}

function renderScene(){
 if(state.current>=scenarios.length){renderResult();return;}
 const s=scenarios[state.current];
 document.getElementById("app").innerHTML=`
 <section class="max-w-4xl mx-auto fade">
   <div class="flex gap-4 items-center mb-6">
     <div class="text-5xl bg-sky-50 rounded-2xl p-4">${s.icon}</div>
     <div>
       <div class="text-xs uppercase tracking-[.22em] text-sky-600 font-bold">Situación ${state.current+1}</div>
       <h2 class="text-2xl md:text-4xl font-black">${s.title}</h2>
     </div>
   </div>
   <div class="rounded-2xl bg-slate-50 border border-slate-200 p-5 mb-6">
     <p class="text-slate-700 leading-relaxed text-lg">${s.text}</p>
   </div>
   <h3 class="text-xl md:text-2xl font-bold mb-4">${s.q}</h3>
   <div class="space-y-3">
     ${s.opts.map((o,i)=>`
       <button onclick="choose(${i})" class="choice w-full text-left rounded-2xl bg-white border border-slate-200 p-4 md:p-5">
        <span class="inline-flex w-8 h-8 items-center justify-center rounded-full bg-sky-100 text-sky-700 font-black mr-3">${String.fromCharCode(65+i)}</span>
        ${o[0]}
       </button>`).join("")}
   </div>
   <p class="text-xs text-slate-400 text-center mt-5">Responde pensando en tu comportamiento habitual.</p>
 </section>`;
 updateHUD();
}

function choose(i){
 const s=scenarios[state.current];
 state.answers.push(s.opts[i][1]);
 state.current++;
 save();
 updateHUD();
 setTimeout(renderScene,120);
}

function calculate(){
 const counts={reflexivo:0,social:0,autonomo:0,armonizador:0};
 state.answers.forEach(a=>counts[a]++);
 let max=Math.max(...Object.values(counts));
 let top=Object.keys(counts).filter(k=>counts[k]===max);
 let main=top[0];

 // secondary style
 let sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
 let secondary=sorted[1][0];
 return {counts,main,secondary};
}

function renderResult(){
 const r=calculate();
 const p=profiles[r.main];
 const s=profiles[r.secondary];
 const total=scenarios.length;
 const bars=Object.entries(r.counts).map(([k,v])=>{
   const pct=Math.round(v/total*100);
   return `
   <div class="mb-4">
     <div class="flex justify-between text-sm mb-1">
       <span class="font-bold">${profiles[k].icon} ${profiles[k].name}</span>
       <span>${pct}%</span>
     </div>
     <div class="h-3 rounded-full bg-slate-100 overflow-hidden">
       <div class="h-full bg-gradient-to-r from-sky-400 to-pink-400" style="width:${pct}%"></div>
     </div>
   </div>`;
 }).join("");

 document.getElementById("app").innerHTML=`
 <section class="max-w-4xl mx-auto fade">
   <div class="text-center">
     <div class="text-7xl mb-3">${p.icon}</div>
     <div class="text-xs uppercase tracking-[.28em] text-pink-500 font-bold">Tu patrón predominante</div>
     <h2 class="text-4xl md:text-5xl font-black mt-2">${p.name}</h2>
     <p class="text-slate-600 text-lg mt-4 max-w-2xl mx-auto">${p.desc}</p>
   </div>

   <div class="grid md:grid-cols-2 gap-5 mt-8">
     <div class="rounded-3xl bg-sky-50 border border-sky-100 p-6">
       <h3 class="font-black text-xl">✨ Fortalezas que aparecen</h3>
       <ul class="mt-4 space-y-2 text-slate-700">
         ${p.strengths.map(x=>`<li>• ${x}</li>`).join("")}
       </ul>
     </div>
     <div class="rounded-3xl bg-amber-50 border border-amber-100 p-6">
       <h3 class="font-black text-xl">🔎 Algo para observar</h3>
       <p class="mt-4 text-slate-700 leading-relaxed">${p.watch}</p>
     </div>
   </div>

   <div class="rounded-3xl bg-white border border-slate-200 p-6 mt-5">
     <h3 class="font-black text-xl mb-5">Tu mapa de decisiones</h3>
     ${bars}
   </div>

   <div class="rounded-3xl bg-emerald-50 border border-emerald-100 p-6 mt-5">
     <div class="text-xs uppercase tracking-[.2em] text-emerald-700 font-bold">Tendencia secundaria</div>
     <h3 class="text-2xl font-black mt-1">${s.icon} ${s.name}</h3>
     <p class="text-slate-700 mt-2">
       También aparecen rasgos de este estilo. Esto significa que tu forma de decidir puede cambiar según el contexto; las personas no pertenecen a una sola categoría.
     </p>
   </div>

   <div class="rounded-3xl bg-slate-900 text-white p-6 mt-5">
     <h3 class="font-black text-xl">🪞 El espejo final</h3>
     <p class="text-white/80 mt-3 leading-relaxed">
       Tu resultado no indica si decides “bien” o “mal”. Muestra qué factores parecen pesar más cuando eliges:
       análisis, pertenencia social, autonomía o búsqueda de equilibrio. Una misma persona puede utilizar estilos distintos según la situación.
     </p>
   </div>

   <div class="text-center mt-7">
     <button onclick="resetGame()" class="bg-slate-900 text-white px-6 py-3 rounded-2xl font-black">Volver a realizarlo</button>
   </div>

   <p class="text-xs text-slate-400 text-center mt-6 max-w-2xl mx-auto">
     Resultado orientativo con fines educativos. No constituye un test psicológico validado, diagnóstico, evaluación clínica ni reemplaza la valoración de un profesional de psicología.
   </p>
 </section>`;
 document.getElementById("sceneCount").textContent="8/8";
 document.getElementById("progressBar").style.width="100%";
 document.getElementById("progressText").textContent="100%";
}

updateHUD();
if(state.started && state.current<scenarios.length) renderScene();
else if(state.started && state.current>=scenarios.length) renderResult();
else renderIntro();
</script>
</body>
</html>
